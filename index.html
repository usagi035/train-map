<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>路線図エディタ</title>
<style>
  :root { --ink:#1f2d36; --paper:#f4f6f5; --rule:#d5dcda; --signal:#1f8a5b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { display:flex; flex-direction:column; color:var(--ink);
         font-family:"Noto Sans JP","Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif; font-size:14px; }
  header { background:var(--ink); color:#fff; display:flex; flex-direction:column; gap:6px; padding:8px 10px 0; }
  #tabs { display:flex; gap:2px; align-items:flex-end; flex-wrap:wrap; }
  .tab { background:#34454f; color:#cfd9d6; border-radius:6px 6px 0 0; display:flex; align-items:center; gap:6px; padding:0 4px 0 14px; }
  .tab span { padding:7px 0; cursor:pointer; }
  .tab.on { background:var(--paper); color:var(--ink); font-weight:700; }
  .tab .x { background:none; border:0; color:inherit; opacity:.6; cursor:pointer; border-radius:4px; padding:3px 6px; font-size:12px; }
  .tab .x:hover { opacity:1; background:rgba(128,128,128,.3); }
  #addmap, #listbtn { background:none; color:#cfd9d6; border:0; padding:4px 10px; cursor:pointer; font:inherit; }
  #addmap { font-size:18px; }
  #home { flex:1; overflow:auto; padding:24px 32px; background:var(--paper); display:none; }
  #home h2 { margin:0 0 12px; font-size:18px; }
  #home ul { list-style:none; margin:0 0 16px; padding:0; max-width:520px; }
  #home li { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--rule); }
  #home li > span:first-child { flex:1; font-weight:700; }
  #home .st { color:var(--signal); font-size:12px; }
  #home button { background:#fff; color:var(--ink); border:1px solid #b9c4c1; border-radius:5px; padding:5px 11px; cursor:pointer; font:inherit; }
  #tools { display:flex; gap:6px; align-items:center; background:var(--paper); color:var(--ink);
           margin:0 -10px; padding:8px 10px; border-bottom:1px solid var(--rule); flex-wrap:wrap; }
  #tools .sp { flex:1; }
  button { font:inherit; }
  #tools button, aside button { background:#fff; color:var(--ink); border:1px solid #b9c4c1; border-radius:5px; padding:5px 11px; cursor:pointer; }
  #tools button.on { background:var(--signal); border-color:var(--signal); color:#fff; }
  #tools button:hover:not(.on), aside button:hover { background:#eaf0ee; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--signal); outline-offset:1px; }
  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; overflow:auto; background:var(--paper); }
  #cv { display:block; user-select:none; }
  aside { width:270px; border-left:1px solid var(--rule); background:#fff; padding:12px; overflow:auto; }
  aside h3 { margin:16px 0 6px; font-size:13px; }
  aside h3:first-child { margin-top:0; }
  aside label { display:block; margin-bottom:8px; font-size:12px; color:#52636c; }
  aside input:not([type=color]) { display:block; width:100%; padding:5px 7px; margin-top:3px; border:1px solid #b9c4c1; border-radius:4px; font:inherit; color:var(--ink); }
  aside .row { display:flex; gap:6px; margin-bottom:8px; }
  aside input[type=color] { width:42px; height:32px; padding:0; border:1px solid #b9c4c1; border-radius:4px; background:#fff; }
  aside input[type=range] { padding:0; }
  aside select { display:block; width:100%; padding:5px 7px; margin-top:3px; border:1px solid #b9c4c1; border-radius:4px; font:inherit; background:#fff; color:var(--ink); }
  aside .note { font-size:12px; color:#52636c; margin:0 0 8px; }
  #lines { list-style:none; margin:0 0 8px; padding:0; }
  #lines li { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:5px; cursor:pointer; }
  #lines li.on { background:#e3efe9; font-weight:700; }
  #lines i { width:22px; height:6px; border-radius:3px; flex:none; }
  #hint { position:fixed; left:12px; bottom:10px; background:var(--ink); color:#fff; padding:6px 12px; border-radius:5px; font-size:12px; pointer-events:none; }
</style>
</head>
<body>
<header>
  <div id="tabs"></div>
  <div id="tools">
    <button data-tool="select">選択・移動</button>
    <button data-tool="station">駅を追加</button>
    <button data-tool="crossing">踏切を追加</button>
    <button data-tool="box">ラベル枠を追加</button>
    <label><input type="checkbox" id="snap" checked> グリッドに合わせる</label>
    <label><input type="checkbox" id="autosel" checked> 追加後に選択へ戻る</label>
    <button id="del">選択を削除</button>
    <span class="sp"></span>
    <button id="zout" title="縮小">－</button><span id="zlabel" style="min-width:44px;text-align:center">100%</span><button id="zin" title="拡大">＋</button><button id="zreset" title="等倍に戻す">等倍</button>
    <button id="exp">書き出し</button>
    <button id="imp">読み込み</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
</header>
<main>
  <div id="stage"><svg id="cv" width="2400" height="1600" viewBox="0 0 2400 1600"></svg></div>
  <aside id="side"></aside>
  <div id="home"></div>
</main>
<div id="hint"></div>

<script src="renderer.js"></script>
</body>
</html>
