<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>路線図エディタ</title>
<style>
  :root { --ink:#1f2d36; --paper:#f4f6f5; --rule:#d5dcda; --signal:#1f8a5b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { display:flex; flex-direction:column; color:var(--ink);
         font-family:"Noto Sans JP","Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif; font-size:14px; }
  header { background:var(--ink); color:#fff; display:flex; flex-direction:column; gap:6px; padding:8px 10px 0; }
  #tabs { display:flex; gap:2px; align-items:flex-end; flex-wrap:wrap; }
  .tab { background:#34454f; color:#cfd9d6; border-radius:6px 6px 0 0; display:flex; align-items:center; gap:6px; padding:0 4px 0 14px; }
  .tab span { padding:7px 0; cursor:pointer; }
  .tab.on { background:var(--paper); color:var(--ink); font-weight:700; }
  .tab .x { background:none; border:0; color:inherit; opacity:.6; cursor:pointer; border-radius:4px; padding:3px 6px; font-size:12px; }
  .tab .x:hover { opacity:1; background:rgba(128,128,128,.3); }
  #addmap, #listbtn { background:none; color:#cfd9d6; border:0; padding:4px 10px; cursor:pointer; font:inherit; }
  #addmap { font-size:18px; }
  #home { flex:1; overflow:auto; padding:24px 32px; background:var(--paper); display:none; }
  #home h2 { margin:0 0 12px; font-size:18px; }
  #home ul { list-style:none; margin:0 0 16px; padding:0; max-width:520px; }
  #home li { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--rule); }
  #home li > span:first-child { flex:1; font-weight:700; }
  #home .st { color:var(--signal); font-size:12px; }
  #home button { background:#fff; color:var(--ink); border:1px solid #b9c4c1; border-radius:5px; padding:5px 11px; cursor:pointer; font:inherit; }
  #tools { display:flex; gap:6px; align-items:center; background:var(--paper); color:var(--ink);
           margin:0 -10px; padding:8px 10px; border-bottom:1px solid var(--rule); flex-wrap:wrap; }
  #tools .sp { flex:1; }
  button { font:inherit; }
  #tools button, aside button { background:#fff; color:var(--ink); border:1px solid #b9c4c1; border-radius:5px; padding:5px 11px; cursor:pointer; }
  #tools button.on { background:var(--signal); border-color:var(--signal); color:#fff; }
  #tools button:disabled { opacity:.45; cursor:not-allowed; }
  #tools button:disabled:hover { background:#fff; }
  #tools button:hover:not(.on), aside button:hover { background:#eaf0ee; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--signal); outline-offset:1px; }
  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; overflow:auto; background:var(--paper); }
  #cv { display:block; user-select:none; }
  aside { width:270px; border-left:1px solid var(--rule); background:#fff; padding:12px; overflow:auto; }
  /* 左サイドバー(統合): 上=選択中の路線の駅リスト(ここだけがスクロール) / 下=クイック操作(高さ固定)。
     幅は #splleft をドラッグで変えられる(--lw に保存) */
  #leftcol { flex:0 0 auto; width:var(--lw, 400px); display:flex; flex-direction:column;
             min-height:0; overflow:hidden; background:#fff; }
  #leftcol > aside { width:auto; border-left:0; }
  #left { flex:1 1 auto; min-height:0; }                        /* 残り高さをもらってスクロール */
  #quick { flex:0 0 auto; max-height:75%; border-top:1px solid var(--rule); }  /* 下から高さ固定 */
  /* サイドバーの幅をドラッグで変えるハンドル(#splleft=左 / #splright=右) */
  .split { position:relative; flex:0 0 7px; background:#fff; cursor:col-resize; }
  .split::after { content:""; position:absolute; top:0; bottom:0; left:2px; width:2px; background:var(--rule); }
  .split:hover::after, .split.drag::after { background:var(--signal); }
  .split:focus-visible { outline:2px solid var(--signal); outline-offset:-2px; }
  #side { border-left:0; width:var(--rw, 270px); }
  #quick h3 { margin:14px 0 7px; font-size:12.5px; border-top:1px dashed var(--rule); padding-top:11px; }
  #quick h3:first-child { margin-top:0; border-top:0; padding-top:0; }
  #quick > button { display:block; width:100%; margin-bottom:7px; }
  #quick .layeropts { grid-template-columns:1fr; gap:6px; margin-bottom:0; }
  #quick .qline { display:flex; align-items:center; gap:6px; margin-bottom:4px; font-size:12.5px; color:var(--ink); }
  #quick .qline input { flex:none; }
  #quick .qline i { display:inline-block; width:18px; height:5px; border-radius:3px; flex:none; }
  #quick .qline span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #left h3 i { display:inline-block; width:18px; height:6px; border-radius:3px; margin-right:6px; vertical-align:middle; }
  aside h3 { margin:16px 0 6px; font-size:13px; }
  aside h3:first-child { margin-top:0; }
  aside label { display:block; margin-bottom:8px; font-size:12px; color:#52636c; }
  aside input:not([type=color]) { display:block; width:100%; padding:5px 7px; margin-top:3px; border:1px solid #b9c4c1; border-radius:4px; font:inherit; color:var(--ink); }
  aside .row { display:flex; gap:6px; margin-bottom:8px; }
  aside input[type=color] { width:42px; height:32px; padding:0; border:1px solid #b9c4c1; border-radius:4px; background:#fff; }
  aside input[type=range] { padding:0; }
  aside select { display:block; width:100%; padding:5px 7px; margin-top:3px; border:1px solid #b9c4c1; border-radius:4px; font:inherit; background:#fff; color:var(--ink); }
  aside .note { font-size:12px; color:#52636c; margin:0 0 8px; }
  #lines, #roadlist, #imglist { list-style:none; margin:0 0 8px; padding:0; }
  #lines li, #roadlist li, #imglist li { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:5px; cursor:pointer; }
  #lines li.on, #roadlist li.on, #imglist li.on { background:#e3efe9; font-weight:700; }
  #lines i, #roadlist i { width:22px; height:6px; border-radius:3px; flex:none; }
  #roadlist i { height:9px; }
  #imglist li img { width:36px; height:26px; object-fit:cover; border-radius:3px; border:1px solid rgba(0,0,0,.18); background:#fff; flex:none; }
  #imglist li span { font-size:12px; color:#52636c; }
  /* レイヤー(路線の表示/非表示・ロック・重ね順) */
  #lines li { gap:5px; padding:5px 6px; }
  #lines li.off { background:#f5f7f6; }
  #lines li.off .lname, #lines li.off > i { opacity:.45; }
  #lines .lname { flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #lines .lbtns { display:flex; gap:3px; flex:none; }
  #lines .lyr { padding:2px 5px; font-size:12px; line-height:1.5; flex:none; }
  #lines .lbtns .lyr { min-width:26px; }
  #lines .lyr:disabled { opacity:.35; cursor:default; }
  #lines .lyr:disabled:hover { background:#fff; }
  .layeropts { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
  /* トグルスイッチ(クイック操作パネルのON/OFF。左に文言、右にスイッチ)。
     中身は checkbox なので、値の判定と保存は従来のチェックボックスと同じ仕組みで動く */
  #quick .qsw { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:5px;
                font-size:12.5px; color:var(--ink); cursor:pointer; }
  #quick .qsw > span:first-child { flex:1; min-width:0; }
  #quick .qsw input { position:absolute; opacity:0; width:0; height:0; margin:0; padding:0; border:0; }
  #quick .qsw .track { position:relative; flex:none; width:34px; height:19px; border-radius:10px;
                       background:#c4cfcb; transition:background .15s ease; }
  #quick .qsw .track::after { content:""; position:absolute; top:2px; left:2px; width:15px; height:15px;
                              border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.3);
                              transition:transform .15s ease; }
  #quick .qsw input:checked + .track { background:var(--signal); }
  #quick .qsw input:checked + .track::after { transform:translateX(15px); }
  #quick .qsw:hover .track { filter:brightness(.97); }
  #quick .qsw input:focus-visible + .track { outline:2px solid #4a8fd4; outline-offset:2px; }
  #quick .layeropts .qsw { margin-bottom:0; }
  /* 右パネルのグループ(見出しクリックで開閉するセクション) */
  .sec { border:1px solid #dde6e3; border-radius:7px; background:#fff; margin-bottom:8px; overflow:hidden; }
  .sech { display:flex; align-items:center; gap:7px; width:100%; padding:7px 9px; background:#eef3f1; border:0; font-size:13px; font-weight:700; color:#2b3a41; text-align:left; cursor:pointer; }
  .sech:hover { background:#e6edeb; }
  .sect { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .secn { flex:none; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; font-weight:700; color:#5c6f77; background:#fff; border:1px solid #cfdbd7; border-radius:9px; padding:0 7px; }
  .seci { flex:none; font-size:10px; color:#6b7c84; transform:rotate(-90deg); transition:transform .15s; }
  .sec.open > .sech .seci { transform:rotate(0deg); }
  .secb { padding:9px; border-top:1px solid #dde6e3; }
  .secb h3 { margin:0 0 6px; font-size:12.5px; }
  .subh { font-size:12px; font-weight:700; color:#3d5058; margin:12px 0 6px; padding-top:9px; border-top:1px dashed #dbe4e1; }
  .sec[data-sec="sel"] > .sech { background:#e4f1ec; color:#1f6b4c; }
  .sec[data-sec="sel"] > .sech:hover { background:#d8ebe3; }
  .sec[data-sec="sel"] .secn { color:#1f6b4c; border-color:#b6d8ca; }
  /* 乗り換え駅の「接続する駅」リスト(路線ごと) */
  .linkgroup { margin-bottom:10px; padding:8px; border:1px solid #e3ebe8; border-radius:6px; background:#fbfcfc; }
  .linkgroup .lghead { display:flex; align-items:center; gap:6px; font-weight:700; color:#2b3a41; margin-bottom:6px; }
  .linkgroup .lghead i { width:16px; height:5px; border-radius:3px; flex:none; }
  .linklist { list-style:none; margin:0 0 8px; padding:0; }
  .linklist li { display:flex; align-items:center; gap:6px; padding:5px 6px; border:1px solid #dbe4e1; border-radius:5px; background:#fff; margin-bottom:4px; cursor:grab; }
  .linklist li.dragging { opacity:.4; }
  .linklist li.dropto { border-color:#2f7d64; box-shadow:0 0 0 1px #2f7d64 inset; }
  .linklist .lhandle { color:#8fa3a9; font-weight:700; cursor:grab; flex:none; user-select:none; }
  .linklist i { width:16px; height:5px; border-radius:3px; flex:none; }
  .linklist .lname { flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .linklist .lbtns { display:flex; gap:3px; flex:none; }
  .linklist button { padding:2px 6px; font-size:12px; line-height:1.5; }
  .linklist button:disabled { opacity:.4; cursor:default; }
  .linklist li.on { border-color:#2f7d64; background:#eaf5f1; }
  .linklist .badge { flex:none; font-size:10px; font-weight:700; color:#2f7d64; background:#e3efe9; border-radius:3px; padding:1px 5px; }
  .linklist svg { flex:none; }
  #hint { position:fixed; left:calc(var(--lw, 400px) + 17px); bottom:10px; background:var(--ink); color:#fff; padding:6px 12px; border-radius:5px; font-size:12px; pointer-events:none; }
</style>
</head>
<body>
<header>
  <div id="tabs"></div>
  <div id="tools">
    <button data-tool="select">選択・移動</button>
    <button data-tool="station">駅を追加</button>
    <button data-tool="hub">乗り換え駅を追加</button>
    <button data-tool="crossing">踏切を追加</button>
    <button data-tool="busstop" title="幹線道路とは独立したバス停">バス停を追加</button>
    <button data-tool="terminal" title="幹線道路とは独立したバスターミナル">バスターミナルを追加</button>
    <button data-tool="road" title="クリックで頂点を追加して道路を引く">幹線道路を引く</button>
    <button data-tool="box">ラベル枠を追加</button>
    <button id="addimg" title="画像ファイル(PNG・JPGなど)を配置して、移動・リサイズ・下敷きができます">画像を追加</button>
    <button id="del">選択を削除</button>
    <button id="undo" title="元に戻す (Ctrl+Z)">↶ 元に戻す</button>
    <button id="redo" title="やり直す (Ctrl+Y / Ctrl+Shift+Z)">↷ やり直す</button>
    <span class="sp"></span>
    <button id="zout" title="縮小">－</button><span id="zlabel" style="min-width:44px;text-align:center">100%</span><button id="zin" title="拡大">＋</button><button id="zreset" title="等倍に戻す">等倍</button>
    <button id="exp">書き出し</button>
    <button id="imp">読み込み</button>
    <button id="expimg" title="PNG画像として保存">画像書き出し</button>
    <input type="file" id="file" accept=".json" hidden>
    <input type="file" id="imgfile" accept="image/*" hidden>
  </div>
</header>
<main>
  <div id="leftcol">
    <aside id="left"></aside>
    <aside id="quick"></aside>
  </div>
  <div class="split" id="splleft" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="左サイドバーの幅" title="ドラッグで左サイドバーの幅を変更(ダブルクリックで既定値)"></div>
  <div id="stage"><svg id="cv" width="2400" height="1600" viewBox="0 0 2400 1600"></svg></div>
  <div class="split" id="splright" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="右サイドバーの幅" title="ドラッグで右サイドバーの幅を変更(ダブルクリックで既定値)"></div>
  <aside id="side"></aside>
  <div id="home"></div>
</main>
<div id="hint"></div>

<script type="module" src="./src/renderer/renderer.js"></script>
</body>
</html>
